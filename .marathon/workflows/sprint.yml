# Sprint Workflow — Marathon Sprint DAG as Spec Kit Pipeline
#
# This file encodes the full sprint cycle as a declarative workflow.
# Each step maps to an agent action with defined inputs, outputs, and gates.
#
# Execution modes:
#   - Manual: a human triggers each step via Cursor CLI or SDK
#   - Semi-auto: steps run automatically, gates pause for human approval
#   - Full-auto: all gates disabled, sprint runs end-to-end unattended

name: sprint
version: 1

config:
  max_parallel_agents: 8
  follow_up_loop_limit: 2
  sprint_timeout_hours: 4
  default_model: claude-sonnet-4
  premium_model: claude-opus-4
  fast_model: claude-sonnet-4

inputs:
  sprint_number: required
  requirements_batch: required    # which requirement IDs to include
  sprint_dir: ".marathon/sprints/${sprint_number}"

# ---------------------------------------------------------------------------
# Phase 1: Specification (sequential, single-threaded)
# ---------------------------------------------------------------------------

steps:
  - id: specify
    name: Specification
    skill: sdd-specify
    model: ${config.premium_model}
    inputs:
      - .marathon/inputs/requirements.md
      - .marathon/inputs/product.md
      - .marathon/inputs/constraints.md
    outputs:
      - ${sprint_dir}/spec.md
    description: >
      Transform the next batch of requirements into a structured,
      executable specification. Read requirements marked [TODO] up to
      the batch defined for this sprint.

  - id: clarify
    name: Clarification
    skill: sdd-clarify
    model: ${config.premium_model}
    depends_on: [specify]
    inputs:
      - ${sprint_dir}/spec.md
      - .marathon/inputs/product.md
      - .marathon/inputs/constraints.md
    outputs:
      - ${sprint_dir}/clarifications.md
    description: >
      Identify ambiguities, gaps, contradictions, and unstated assumptions
      in the spec. Resolve them against product.md and constraints.md.
      Append clarifications to the spec.

  - id: plan
    name: Planning
    skill: sdd-plan
    model: ${config.premium_model}
    depends_on: [clarify]
    inputs:
      - ${sprint_dir}/spec.md
      - ${sprint_dir}/clarifications.md
      - .marathon/inputs/stack.md
    outputs:
      - ${sprint_dir}/plan.md
    description: >
      Generate an implementation plan: component breakdown, API contracts,
      data models, file paths, migration strategy.

  - id: architect_review
    name: Architect Review
    skill: architect-review
    model: ${config.premium_model}
    depends_on: [plan]
    inputs:
      - ${sprint_dir}/plan.md
      - .marathon/inputs/stack.md
      - .marathon/inputs/constraints.md
    outputs:
      - ${sprint_dir}/plan.md       # revised in place
      - ${sprint_dir}/arch-notes.md
    description: >
      Review the plan against the tech stack, constraints, and existing
      codebase. Catch structural violations. Revise the plan. Define
      interfaces between parallel tasks so they cannot conflict.

  - id: ux_review
    name: UX Review
    skill: ux-reviewer
    model: ${config.premium_model}
    depends_on: [architect_review]
    inputs:
      - ${sprint_dir}/plan.md
      - .marathon/inputs/constraints.md
    outputs:
      - ${sprint_dir}/ux-review.md
    description: >
      Review the plan against design system and UX principles. Flag
      missing states, accessibility gaps, empty states, error states,
      loading states, flow issues, responsive concerns.

  - id: decompose
    name: Task Decomposition
    skill: sdd-tasks
    model: ${config.premium_model}
    depends_on: [ux_review]
    inputs:
      - ${sprint_dir}/plan.md
      - ${sprint_dir}/arch-notes.md
      - ${sprint_dir}/ux-review.md
    outputs:
      - ${sprint_dir}/tasks.md
    description: >
      Decompose the reviewed plan into an ordered task list. Mark
      parallelizable tasks with [P]. Define dependency chains for
      sequential tasks. Each task gets file paths, acceptance criteria,
      and a complexity estimate.
    gate:
      type: optional            # enable for early sprints, disable later
      prompt: "Review tasks.md before implementation begins?"

  # ---------------------------------------------------------------------------
  # Phase 2: Implementation (parallel fan-out)
  # ---------------------------------------------------------------------------

  - id: implement
    name: Implementation
    type: fan_out
    depends_on: [decompose]
    source: ${sprint_dir}/tasks.md
    max_parallel: ${config.max_parallel_agents}
    model: ${config.default_model}
    per_task:
      skill: sdd-implement
      inputs:
        - task definition from tasks.md
        - ${sprint_dir}/arch-notes.md
        - ${sprint_dir}/plan.md
      outputs:
        - git branch per task
        - pull request per task
      hooks:
        - pre: lint
        - pre: typecheck
        - post: test
      on_hook_failure: retry_step   # agent retries if hooks fail
    description: >
      Each task spawns its own Cloud Agent on its own branch via git
      worktree. Parallel [P] tasks run simultaneously (up to max_parallel).
      Sequential tasks wait for their dependency tasks to merge.

  # ---------------------------------------------------------------------------
  # Phase 3: Review (per-PR, automated)
  # ---------------------------------------------------------------------------

  - id: code_review
    name: Code Review
    type: per_pr
    depends_on: [implement]
    model: ${config.default_model}
    subagents:
      - name: security-review
        focus: security vulnerabilities, injection, auth bypass
        mode: read_only
      - name: correctness-review
        focus: logic errors, edge cases, error handling
        mode: read_only
      - name: performance-review
        focus: N+1 queries, unnecessary re-renders, memory leaks
        mode: read_only
    outputs:
      - review comments on PR
      - suggested fixes
    description: >
      Parallel read-only subagents analyze each PR diff across multiple
      dimensions. Results are merged into a single review.

  - id: bugbot_review
    name: BugBot PR Review
    type: per_pr
    depends_on: [implement]
    trigger: automatic           # fires on PR creation via .cursor/BUGBOT.md
    description: >
      BugBot reviews each PR using different models than the implementation
      agent. Autofix spawns Cloud Agents to resolve flagged issues. This
      step is event-driven — it fires automatically when PRs are created.

  # ---------------------------------------------------------------------------
  # Phase 4: Integration & Testing
  # ---------------------------------------------------------------------------

  - id: merge_prs
    name: Merge PRs
    depends_on: [code_review, bugbot_review]
    description: >
      All PRs from the sprint are merged into the sprint branch.
      This step blocks until all reviews are complete and all PRs pass CI.

  - id: integration_test
    name: Integration Test
    skill: sdd-verify
    model: ${config.default_model}
    depends_on: [merge_prs]
    inputs:
      - merged sprint branch
      - ${sprint_dir}/spec.md
    outputs:
      - ${sprint_dir}/test-report.md
    description: >
      Run the full test suite on the integrated sprint branch. Build the
      app end-to-end. Run e2e tests. Report results.

  - id: ux_test
    name: UX Testing
    model: ${config.default_model}
    depends_on: [integration_test]
    browser: true
    inputs:
      - running build
      - ${sprint_dir}/spec.md
    outputs:
      - ${sprint_dir}/ux-test-report.md
    description: >
      Drive the built app using Cursor's browser integration. Navigate
      flows defined in the spec. Take screenshots. Check against design
      system expectations and accessibility requirements.

  - id: ux_feedback
    name: UX Feedback
    model: ${config.default_model}
    depends_on: [ux_test]
    inputs:
      - ${sprint_dir}/ux-test-report.md
      - ${sprint_dir}/spec.md
      - ${sprint_dir}/ux-review.md
    outputs:
      - ${sprint_dir}/ux-feedback.md
      - ${sprint_dir}/follow-up-tasks.md   # empty if no issues
    description: >
      Compare test results against original spec and UX review.
      Identify gaps: missing states, accessibility failures, visual
      regressions, flow deviations. Output follow-up tasks if needed.

  # ---------------------------------------------------------------------------
  # Phase 5: Follow-Up Loop (bounded)
  # ---------------------------------------------------------------------------

  - id: follow_up
    name: Follow-Up Loop
    type: loop
    depends_on: [ux_feedback]
    condition: "${sprint_dir}/follow-up-tasks.md is not empty"
    max_iterations: ${config.follow_up_loop_limit}
    steps:
      - implement        # compressed: tasks from follow-up-tasks.md
      - code_review
      - bugbot_review
      - merge_prs
      - ux_test
      - ux_feedback
    on_max_iterations: >
      Log remaining issues as backlog items in requirements.md.
      Proceed to sprint close.

  # ---------------------------------------------------------------------------
  # Phase 6: Sprint Close
  # ---------------------------------------------------------------------------

  - id: sprint_close
    name: Sprint Close
    skill: sprint-close
    model: ${config.default_model}
    depends_on: [follow_up]
    fallback_depends_on: [ux_feedback]   # if no follow-ups needed
    inputs:
      - all sprint artifacts
      - .marathon/inputs/requirements.md
    outputs:
      - ${sprint_dir}/sprint-report.md
      - .marathon/memory/sprint-${sprint_number}-retro.md
    actions:
      - merge sprint branch to main
      - mark completed requirements as [DONE] in requirements.md
      - add follow-up items to backlog in requirements.md
      - update .cursor/rules/sprint-context.md with new state
      - commit all artifacts
    description: >
      Close the sprint. Write retrospective. Update requirements status.
      Prepare context for the next sprint.
